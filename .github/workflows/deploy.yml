name: Publish app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Unpack the app
        run: |
          test -f JainJariApp.zip || { echo "::error::JainJariApp.zip not found. The file name must be exactly JainJariApp.zip"; exit 1; }
          mkdir site && unzip -q JainJariApp.zip -d site
          test -f site/index.html || { echo "::error::index.html missing inside the zip"; exit 1; }
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
